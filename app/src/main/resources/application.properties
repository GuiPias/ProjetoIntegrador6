# Perfil padrao (producao). Todos os valores vem de variaveis de ambiente.
# Senhas e caminhos nao tem valor padrao: sem a variavel, a aplicacao nao sobe.
spring.application.name=produtos

# Banco de dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:produtos}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Somente HTTPS (Tomcat embutido com um unico conector, TLS ativado)
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Actuator: expoe apenas /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.discovery.enabled=false

# Logs vao para a saida padrao (console); nenhum arquivo de log e configurado.
