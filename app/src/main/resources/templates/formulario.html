<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${produto.id == null} ? 'Novo produto' : 'Editar produto')}"></head>
<body>
<main>
    <h1 th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'">Produto</h1>

    <form th:object="${produto}" method="post"
          th:action="${produto.id == null} ? @{/produtos} : @{/produtos/{id}(id=${produto.id})}">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" maxlength="100">
        <p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</p>

        <label for="quantidade">Quantidade em estoque</label>
        <input type="number" id="quantidade" th:field="*{quantidade}" step="1">
        <p class="erro" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}">Erro</p>

        <p>
            <button type="submit">Salvar</button>
            <a th:href="@{/}">Cancelar</a>
        </p>
    </form>
</main>
</body>
</html>
