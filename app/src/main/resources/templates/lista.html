<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Produtos')}"></head>
<body>
<main>
    <h1>Produtos</h1>
    <p><a class="botao" th:href="@{/produtos/novo}">Novo produto</a></p>

    <table th:if="${!produtos.isEmpty()}">
        <thead>
        <tr>
            <th>Nome</th>
            <th class="num">Quantidade</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produtos}">
            <td th:text="${p.nome}">Nome</td>
            <td class="num" th:text="${p.quantidade}">0</td>
            <td class="acoes">
                <a th:href="@{/produtos/{id}/editar(id=${p.id})}">Editar</a>
                <form th:action="@{/produtos/{id}/excluir(id=${p.id})}" method="post"
                      onsubmit="return confirm('Excluir este produto?');">
                    <button type="submit" class="perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${produtos.isEmpty()}">Nenhum produto cadastrado.</p>
</main>
</body>
</html>
